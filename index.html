    <style>
        /* Black and metallic silver are the base theme; red is reserved for accents. */
        body {
            background-color: #000 !important;
            box-sizing: border-box;
        }

        /* Neutralize the original cyan/green lighting while retaining silver detail
           and a controlled, low-saturation red accent. */
        #Stage {
            filter: grayscale(0.84) sepia(0.24) hue-rotate(300deg) saturate(1.16) contrast(1.06);
        }

        /* Fully remove/hide all text boxes, inputs, search fields, and ask prompts */
        input,
        textarea,
        [contenteditable="true"],
        form,
        .input,
        .search,
        .prompt,
        .chat,
        .ask,
        [class*="input"],
        [class*="search"],
        [class*="ask"],
        [class*="prompt"] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
            height: 0 !important;
            width: 0 !important;
            position: absolute !important;
            top: -9999px !important;
            left: -9999px !important;
        }

        /* A restrained silver frame keeps the infinity mark readable without tinting the page. */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            /* Subtle silver accents only; avoid a persistent red wash. */
            background-image:
                linear-gradient(rgba(210, 214, 220, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(210, 214, 220, 0.06) 1px, transparent 1px);
            background-size: 120px 120px, 120px 120px;
            background-position: center center;
            border: 2px solid rgba(210, 214, 220, 0.35);
            /* Silver border */
            box-shadow: inset 0 0 24px rgba(210, 214, 220, 0.08);
            z-index: 3;
        }

        /* A very low-key red lift brings the WebGL scene back into the festival palette
           without turning the silver highlights pink or making the page glow. */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: rgba(104, 18, 24, 0.14);
            mix-blend-mode: color;
            z-index: 1;
        }

        #scroll-cue {
            position: fixed;
            left: 50%;
            bottom: 28px;
            transform: translateX(-50%);
            z-index: 4;
            color: rgba(235, 226, 226, 0.82);
            font: 300 11px/1.2 nbarchitekt, Arial, sans-serif;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            text-align: center;
            pointer-events: none;
            animation: scrollCuePulse 2.2s ease-in-out infinite;
        }

        #scroll-cue::after {
            content: "↓";
            display: block;
            margin-top: 7px;
            color: #d7959a;
            font-size: 18px;
            letter-spacing: 0;
        }

        @keyframes scrollCuePulse {
            0%, 100% { opacity: 0.48; }
            50% { opacity: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            #scroll-cue { animation: none; }
        }

        #aarohan-countdown {
            position: fixed;
            left: 50%;
            top: calc(50% + clamp(150px, 18vw, 220px));
            transform: translateX(-50%);
            z-index: 5;
            color: #d7959a;
            width: min(100% - 32px, 520px);
            font: 300 14px/1.25 nbarchitekt, Arial, sans-serif;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            text-align: center;
            white-space: nowrap;
            text-shadow: 0 0 12px rgba(215, 149, 154, 0.28);
            pointer-events: none;
        }

        @media (max-width: 700px) {
            #aarohan-countdown {
                top: calc(50% + 115px);
                width: calc(100% - 24px);
                font-size: clamp(11px, 3vw, 13px);
                letter-spacing: 0.08em;
            }
        }

        #coming-soon {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: rgba(0, 0, 0, 0.82);
            color: #d8d8d8;
            text-align: center;
            font: 300 15px/1.6 nbarchitekt, Arial, sans-serif;
            letter-spacing: 0.08em;
            z-index: 6;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 220ms ease, visibility 220ms ease;
        }

        #coming-soon.is-visible {
            opacity: 1;
            visibility: visible;
            /* Informational only: never trap wheel/touch input, especially upward scroll. */
            pointer-events: none;
        }

        #coming-soon span {
            display: block;
            margin-top: 8px;
            color: #d7959a;
            font-size: 11px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        #main-nav-overlay {
            position: fixed;
            top: 24px;
            right: 32px;
            z-index: 5;
            width: min(300px, calc(100vw - 48px));
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            gap: 18px;
            padding: 0 20px;
            border: 1px solid rgba(210, 190, 194, 0.58);
            border-radius: 28px;
            background: rgba(10, 8, 9, 0.72);
            color: #e0dadd;
            font: 300 12px/1 nbarchitekt, Arial, sans-serif;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            pointer-events: none;
        }

        #main-nav-overlay span + span::before {
            content: "";
            display: inline-block;
            width: 42px;
            height: 1px;
            margin-right: 18px;
            vertical-align: middle;
            background: rgba(210, 190, 194, 0.58);
        }

        #content-switcher {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            z-index: 5;
            display: flex;
            gap: 8px;
            transition: opacity 220ms ease, visibility 220ms ease;
        }

        #content-switcher button {
            border: 1px solid rgba(215, 149, 154, 0.42);
            border-radius: 999px;
            padding: 7px 12px;
            color: #ded6d8;
            background: rgba(10, 8, 9, 0.76);
            font: 300 10px/1 nbarchitekt, Arial, sans-serif;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
        }

        #content-switcher button.is-active,
        #content-switcher button:hover {
            color: #120c0d;
            background: #d7959a;
        }

        body.spine-active #content-switcher {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        @media (max-width: 700px) {
            #main-nav-overlay {
                top: 22px;

                width: min(270px, calc(100vw - 28px));

                padding: 0 12px;
                font-size: 10px;
            }
            #main-nav-overlay span + span::before {
                width: 26px;
                margin-right: 12px;
            }
        }

    <script>
        // Particle Logo Implementation (Translated from React)
        document.addEventListener("DOMContentLoaded", () => {
            const cv = document.createElement("canvas");
            cv.style.position = 'fixed';
            cv.style.top = '0';
            cv.style.left = '0';
            cv.style.width = '100%';
            cv.style.height = '100%';
            cv.style.pointerEvents = 'none'; // Don't block interactions below
            cv.style.zIndex = '2'; // Keep the mark behind the app UI and silver frame
            document.body.appendChild(cv);

            let alive = true;
            const _l = [];
            const addL = (a, b, c) => { window.addEventListener(a, b, c); _l.push([a, b, c]); };
            const RAF = f => { if (alive) requestAnimationFrame(f); };

            const cx = cv.getContext('2d', { willReadFrequently: true });
            const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
            let W, H, dpr, S, CX, CY, mouse = { x: -999, y: -999 };
            // Fewer particles and a capped pixel ratio keep the mark smooth on laptops and phones.
            const N = innerWidth < 700 ? 650 : 1050, P = [];
            let targetPts = [];

            function size() {
                dpr = Math.min(devicePixelRatio || 1, 1.5);
                W = window.innerWidth;
                H = window.innerHeight;
                cv.width = W * dpr;
                cv.height = H * dpr;
                cx.setTransform(dpr, 0, 0, dpr, 0, 0);

                // Top-Left positioning with responsive scale
                if (W < 700) {
                    S = 48; // Small and aligned with the navigation row
                    CX = 18 + (S * 0.5);
                    CY = 18 + (S * 0.35);
                } else {
                    S = Math.min(Math.max(W * 0.06, 72), 118); // Same visual row as the navbar
                    CX = 24 + (S * 0.5);
                    CY = 18 + (S * 0.35);
                }
            }

            function sample(img) {
                const w = img.width, h = img.height, k = 320 / Math.max(w, h);
                const cw = Math.round(w * k), ch = Math.round(h * k);
                const o = document.createElement('canvas');
                o.width = cw;
                o.height = ch;
                const c = o.getContext('2d');
                c.drawImage(img, 0, 0, cw, ch);

                const d = c.getImageData(0, 0, cw, ch).data, pts = [];
                for (let y = 0; y < ch; y++) {
                    for (let x = 0; x < cw; x++) {
                        const i = (y * cw + x) * 4;
                        // Filter out dark/transparent background, keeping silver elements
                        if (d[i + 3] > 80 && d[i] + d[i + 1] + d[i + 2] > 110) {
                            pts.push([(x - cw / 2) / 320, (y - ch / 2) / 320, d[i], d[i + 1], d[i + 2]]);
                        }
                    }
                }
                for (let i = pts.length - 1; i > 0; i--) {
                    const j = Math.random() * (i + 1) | 0;
                    [pts[i], pts[j]] = [pts[j], pts[i]];
                }
                return pts;
            }

            function retarget() {
                if (!targetPts || !targetPts.length) return;
                for (let i = 0; i < N; i++) {
                    const p = P[i], t = targetPts[i % targetPts.length];
                    p.t = t;
                }
            }

            function frame() {
                cx.clearRect(0, 0, W, H);
                const sp = reduce ? .3 : .07, fr = reduce ? .6 : .86;

                for (const p of P) {
                    const t = p.t;
                    if (!t) continue;

                    const tx = CX + t[0] * S * 1.0 + p.jx;
                    const ty = CY + t[1] * S * 1.0 + p.jy;
                    let ax = (tx - p.x) * sp, ay = (ty - p.y) * sp;

                    if (!reduce) {
                        const dx = p.x - mouse.x, dy = p.y - mouse.y, d2 = dx * dx + dy * dy;
                        if (d2 < 14000) {
                            const f = (1 - d2 / 14000) * 3;
                            const d = Math.sqrt(d2) || 1;
                            ax += dx / d * f;
                            ay += dy / d * f;
                        }
                    }

                    p.vx = (p.vx + ax) * fr;
                    p.vy = (p.vy + ay) * fr;
                    p.x += p.vx;
                    p.y += p.vy;

                    // Keep the infinity mark metallic silver; source-logo colors are not used.
                    const silver = p.silver;
                    p.r += (silver - p.r) * .08;
                    p.g += (silver + 2 - p.g) * .08;
                    p.b += (silver + 7 - p.b) * .08;

                    cx.fillStyle = 'rgb(' + (p.r | 0) + ',' + (p.g | 0) + ',' + (p.b | 0) + ')';
                    cx.fillRect(p.x, p.y, 1.8, 1.8);
                }
                RAF(frame);
            }

            function load() {
                return new Promise((resolve, reject) => {
                    const i = new Image();
                    i.crossOrigin = "anonymous";
                    i.onload = () => { targetPts = sample(i); resolve(); };
                    i.onerror = reject;
                    i.src = '/assets/images/ar-logo.png'; // Updated to use the explicitly saved image
                });
            }

            size();
            addL('resize', size);

            for (let i = 0; i < N; i++) {
                const a = Math.random() * 6.283;
                const r = Math.random() * Math.max(window.innerWidth, window.innerHeight);
                P.push({
                    x: window.innerWidth / 2 + Math.cos(a) * r,
                    y: window.innerHeight / 2 + Math.sin(a) * r,
                    vx: 0, vy: 0, r: 60, g: 60, b: 70,
                    silver: 168 + Math.random() * 64,
                    jx: (Math.random() - .5) * 2,
                    jy: (Math.random() - .5) * 2,
                    t: null
                });
            }

            addL('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
            addL('pointerleave', () => { mouse.x = mouse.y = -999; });

            load().then(() => {
                retarget();
                frame();
            }).catch(err => console.error("Error loading logo:", err));

            function fade() {
                cv.style.opacity = Math.max(0, 1 - window.scrollY / (window.innerHeight * .8));
                const cue = document.getElementById('scroll-cue');
                const progress = Math.min(window.scrollY / Math.max(window.innerHeight, 1), 1);
                cue.style.opacity = String(Math.max(0, 1 - progress * 4));
            }

            addL('scroll', fade, { passive: true });
            fade();

            // Release the full experience at 23:59:59 IST on October 8, 2026.
            const deadline = 0;
            const countdown = document.getElementById('aarohan-countdown');
            const comingSoon = document.getElementById('coming-soon');
            // The About section is the last pre-launch section. Keep the hero/About
            // experience navigable, but hold the page before the spine begins.
            const aboutLimit = Math.max(window.innerHeight * 2.8, 1900);
            let unlocked = Date.now() >= deadline;
            let sceneScroll = 0;
            let touchStartY = 0;

            function updateCountdown() {
                const remaining = Math.max(0, deadline - Date.now());
                if (!remaining) {
                    unlocked = true;
                    countdown.textContent = '';
                    countdown.style.display = 'none';
                    return;
                }
                const totalSeconds = Math.floor(remaining / 1000);
                const days = Math.floor(totalSeconds / 86400);
                const hours = Math.floor(totalSeconds % 86400 / 3600);
                const minutes = Math.floor(totalSeconds % 3600 / 60);
                const seconds = totalSeconds % 60;
                countdown.textContent = 'Aarohan begins in ' + days + 'd ' +
                    String(hours).padStart(2, '0') + ':' + String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
            }

            function showComingSoon() {
                if (unlocked) return;
                comingSoon.classList.add('is-visible');
                comingSoon.setAttribute('aria-hidden', 'false');
            }

            function holdAtAbout(event) {
                if (unlocked) return;
                if (event.type === 'wheel') {
                    const delta = Math.max(-180, Math.min(180, event.deltaY || 0));
                    sceneScroll = Math.max(0, sceneScroll + delta);
                    if (delta <= 0 || sceneScroll < aboutLimit) {
                        if (delta < 0) comingSoon.classList.remove('is-visible');
                        return;
                    }
                } else if (event.type === 'touchmove') {
                    const delta = touchStartY - event.touches[0].clientY;
                    if (delta <= 0) {
                        if (delta < 0) comingSoon.classList.remove('is-visible');
                        touchStartY = event.touches[0].clientY;
                        return;
                    }
                    sceneScroll = Math.max(0, sceneScroll + Math.min(delta, 180));
                    touchStartY = event.touches[0].clientY;
                    if (sceneScroll < aboutLimit) return;
                }
                event.preventDefault();
                showComingSoon();
            }

            window.addEventListener('wheel', holdAtAbout, { capture: true, passive: false });
            window.addEventListener('touchstart', event => {
                touchStartY = event.touches[0].clientY;
            }, { capture: true, passive: true });
            window.addEventListener('touchmove', holdAtAbout, { capture: true, passive: false });
            window.addEventListener('keydown', event => {
                if (unlocked) return;
                if (['ArrowUp', 'PageUp', 'Home'].includes(event.key)) {
                    sceneScroll = Math.max(0, sceneScroll - 120);
                    comingSoon.classList.remove('is-visible');
                    return;
                }
                if (['ArrowDown', 'PageDown', ' ', 'End'].includes(event.key)) {
                    sceneScroll = Math.min(aboutLimit, sceneScroll + 120);
                    if (sceneScroll >= aboutLimit) {
                        event.preventDefault();
                        showComingSoon();
                    }
                }
            }, { capture: true });
            updateCountdown();
            setInterval(updateCountdown, 1000);

            document.querySelectorAll('#content-switcher button').forEach(button => {
                button.addEventListener('click', () => {
                    document.querySelectorAll('#content-switcher button').forEach(item => item.classList.remove('is-active'));
                    button.classList.add('is-active');
                    document.body.classList.add('spine-active');
                    const category = button.dataset.category;
                    if (window.AppState && typeof window.AppState.set === 'function') {
                        window.AppState.set('ViewController/navigate', 'work');
                        window.AppState.set('Aarohan/category', category);
                        const scroll = typeof window.AppState.get === 'function'
                            ? window.AppState.get('ViewController/scroll')
                            : null;
                        if (scroll && typeof scroll.scrollTo === 'function') scroll.scrollTo(aboutLimit);
                    }
                });
            });

        });
    </script>
    
</body>
</html>
