<body>
    <svg style="width:0;height:0;position:absolute;" aria-hidden="true" focusable="false">
        <filter id="red-black-silver-theme">
            <!-- Reduced red intensity, shifted more towards a silver/grayscale baseline -->
            <feColorMatrix type="matrix" values="
                0.5 0.3 0.3 0 0.05
                0.3 0.3 0.3 0 0
                0.3 0.3 0.3 0 0
                0   0   0   1 0
            " />
        </filter>
    </svg>
    <style>
        /* Force red/black/silver theme across the entire application */
        body {
            /* We use the SVG filter for a precise red & silver mapping, plus some contrast */
            filter: url(#red-black-silver-theme) contrast(1.1);
            background-color: #000 !important;
            box-sizing: border-box;
        }

        /* Fully remove/hide all text boxes, inputs, search fields, and ask prompts */
        input,
        textarea,
        [contenteditable="true"],
        form,
        .input,
        .search,
        .prompt,
        .chat,
        .ask,
        [class*="input"],
        [class*="search"],
        [class*="ask"],
        [class*="prompt"] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
            height: 0 !important;
            width: 0 !important;
            position: absolute !important;
            top: -9999px !important;
            left: -9999px !important;
        }

        /* Silver border accents and reduced red vignette */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            /* Silver accents via subtle grid lines and a soft red vignette */
            background-image:
                linear-gradient(rgba(192, 192, 192, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(192, 192, 192, 0.15) 1px, transparent 1px),
                radial-gradient(circle, transparent 70%, rgba(150, 0, 0, 0.15) 100%);
            background-size: 100px 100px, 100px 100px, 100% 100%;
            background-position: center center;
            border: 4px solid rgba(192, 192, 192, 0.6);
            /* Silver border */
            box-shadow: inset 0 0 20px rgba(192, 192, 192, 0.2);
            z-index: 2147483647;
            /* Ensure it stays on top */
        }
    </style>
